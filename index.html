<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retroscope</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Nunito', 'sans-serif'],
              hand: ['Caveat', 'cursive'],
            }
          }
        }
      }
    </script>
    <style>
      html { font-size: 20px; }
      body { background: #0d0d14; }

      /* ── Sticky card ── */
      .sticky {
        transform: rotate(var(--r, 0deg));
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 2px 4px 10px rgba(0,0,0,0.4);
      }
      .sticky:hover {
        transform: rotate(0deg) translateY(-5px) scale(1.03);
        box-shadow: 4px 10px 24px rgba(0,0,0,0.55);
        z-index: 10;
        position: relative;
      }

      /* ── Card pop-in ── */
      @keyframes pop-in {
        0%   { transform: scale(0.5) rotate(var(--r,0deg)); opacity: 0; }
        65%  { transform: scale(1.07) rotate(var(--r,0deg)); }
        100% { transform: scale(1)    rotate(var(--r,0deg)); opacity: 1; }
      }
      .pop-in { animation: pop-in 0.32s cubic-bezier(.36,.07,.19,.97) forwards; }

      /* ── Card flip-drop (reveal) ── */
      @keyframes flip-drop {
        0%   { transform: rotateX(90deg) rotate(var(--r,0deg)); opacity: 0; }
        60%  { transform: rotateX(-6deg) rotate(var(--r,0deg)); }
        100% { transform: rotateX(0deg)  rotate(var(--r,0deg)); opacity: 1; }
      }
      .flip-drop { animation: flip-drop 0.42s ease-out forwards; opacity: 0; }

      /* ── Vote counter flip ── */
      @keyframes num-up {
        from { transform: translateY(60%); opacity: 0; }
        to   { transform: translateY(0);   opacity: 1; }
      }
      .num-up { animation: num-up 0.18s ease-out; display: inline-block; }

      /* ── Vote shimmer on card that just received vote ── */
      @keyframes voted-flash {
        0%   { box-shadow: 0 0 0 2px rgba(99,102,241,0); }
        30%  { box-shadow: 0 0 0 4px rgba(99,102,241,0.7); }
        100% { box-shadow: 0 0 0 2px rgba(99,102,241,0); }
      }
      .voted-flash { animation: voted-flash 0.5s ease-out; }

      /* ── Phase slide-up entrance ── */
      @keyframes slide-up {
        from { transform: translateY(16px); opacity: 0; }
        to   { transform: translateY(0);    opacity: 1; }
      }
      .slide-up { animation: slide-up 0.3s ease-out both; }

      /* ── Countdown big number ── */
      @keyframes countdown-pop {
        0%   { transform: scale(0.4); opacity: 0; }
        50%  { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(1); opacity: 0; }
      }
      .countdown-pop { animation: countdown-pop 0.75s ease-out forwards; }

      /* ── Button press ── */
      .btn { transition: transform 0.1s, opacity 0.1s; }
      .btn:active { transform: scale(0.96) !important; opacity: 0.85; }

      /* ── Shake (no more votes) ── */
      @keyframes shake {
        0%,100% { transform: translateX(0); }
        20%,60% { transform: translateX(-5px); }
        40%,80% { transform: translateX(5px); }
      }
      .shake { animation: shake 0.35s ease-out; }

      /* ── Confetti ── */
      @keyframes confetti-fall {
        0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
        85%  { opacity: 0.8; }
        100% { transform: translateY(110vh) rotate(600deg); opacity: 0; }
      }
      .confetti-piece { animation: confetti-fall var(--dur,3s) ease-in var(--delay,0s) forwards; }

      /* ── Player join slide ── */
      @keyframes slide-in-right {
        from { transform: translateX(20px); opacity: 0; }
        to   { transform: translateX(0);    opacity: 1; }
      }
      .slide-in { animation: slide-in-right 0.25s ease-out both; }

      /* ── Board background ── */
      .board-bg {
        background-color: #0d0d14;
        background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
        background-size: 28px 28px;
      }

      /* ── Column gradients ── */
      .col-liked    { background: rgba(4,120,87,0.12); border-color: rgba(52,211,153,0.2) !important; }
      .col-learned  { background: rgba(29,78,216,0.12); border-color: rgba(96,165,250,0.2) !important; }
      .col-lacked   { background: rgba(154,52,18,0.12); border-color: rgba(251,146,60,0.2) !important; }
      .col-longed   { background: rgba(126,34,206,0.12); border-color: rgba(192,132,252,0.2) !important; }

      /* ── Sticky note paper ── */
      .note-liked   { background: #d1fae5; color: #065f46; box-shadow: 0 4px 6px rgba(0,0,0,0.25), 0 8px 24px rgba(0,0,0,0.45), inset 0 -3px 0 rgba(0,0,0,0.1); }
      .note-learned { background: #dbeafe; color: #1e40af; box-shadow: 0 4px 6px rgba(0,0,0,0.25), 0 8px 24px rgba(0,0,0,0.45), inset 0 -3px 0 rgba(0,0,0,0.1); }
      .note-lacked  { background: #ffedd5; color: #92400e; box-shadow: 0 4px 6px rgba(0,0,0,0.25), 0 8px 24px rgba(0,0,0,0.45), inset 0 -3px 0 rgba(0,0,0,0.1); }
      .note-longed  { background: #ede9fe; color: #5b21b6; box-shadow: 0 4px 6px rgba(0,0,0,0.25), 0 8px 24px rgba(0,0,0,0.45), inset 0 -3px 0 rgba(0,0,0,0.1); }

      /* ── Note slap animation ── */
      @keyframes note-slap {
        0%   { transform: scale(0.3) rotate(-15deg); opacity: 0; }
        55%  { transform: scale(1.08) rotate(2deg); opacity: 1; }
        75%  { transform: scale(0.96) rotate(-1deg); }
        100% { transform: scale(1) rotate(var(--r, 0deg)); opacity: 1; }
      }
      .note-slap { animation: note-slap 0.38s cubic-bezier(0.34,1.56,0.64,1) forwards; }
      /* after slap, hover can override transform */
      .note-slap:hover { transform: translateY(-4px) scale(1.03) rotate(0deg) !important; }

      /* ── Score popup ── */
      @keyframes score-pop {
        0%   { transform: translateY(0) scale(0.5); opacity: 0; }
        30%  { transform: translateY(-8px) scale(1.2); opacity: 1; }
        100% { transform: translateY(-32px) scale(1); opacity: 0; }
      }
      .score-pop { animation: score-pop 0.7s ease-out forwards; pointer-events: none; }

      /* ── Avatars ── */
      .av-0{background:#f87171}.av-1{background:#fb923c}
      .av-2{background:#facc15}.av-3{background:#4ade80}
      .av-4{background:#60a5fa}.av-5{background:#a78bfa}
      .av-6{background:#f472b6}.av-7{background:#34d399}

      input, textarea { font-family: 'Nunito', sans-serif; }

      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #374151; border-radius: 9px; }
    </style>
  </head>
  <body class="text-gray-100 min-h-screen font-sans">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
